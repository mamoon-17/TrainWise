<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory</title>
    <link rel="stylesheet" href="productinventory.css"> <!-- Link to your CSS -->
</head>      
<body>
    <h1>All Products</h1>
    
    <!-- Allowing everyone to see this link, but only admins can add a new product -->
    <div id="addProductLink" style="display:none;">
        <a href="productInventoryAdd.html">Add New Product</a>
    </div>
    
    <br><br>
    <table border="1">
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Stock Quantity</th>
                <th id="actionsColumn">Actions</th> <!-- Add an ID to the Actions column -->
            </tr>
        </thead>
        <tbody id="productInventoryTableBody">
            <!-- Product rows will be added here -->
        </tbody>
    </table>

    <script>
        // ✅ Check if the user is logged in
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html"; // Redirect to login page if no token
        }

        // ✅ Decode JWT and check if the user is an admin
        const payload = JSON.parse(atob(token.split('.')[1]));

        // Display "Add New Product" link only if the user is an admin
        if (payload.role.toLowerCase() === "admin") {
            document.getElementById("addProductLink").style.display = "block";
        }

        // If the user is not an admin, hide the "Actions" column
        if (payload.role.toLowerCase() !== "admin") {
            document.getElementById("actionsColumn").style.display = "none";
        }

        // ✅ Fetch and display the product inventory
        fetch("http://localhost:3000/productInventory")
            .then(res => res.json())
            .then(products => {
                const tbody = document.getElementById("productInventoryTableBody");

                products.forEach(product => {
                    const row = `
                        <tr>
                            <td>${product.productID}</td>
                            <td>${product.name}</td>
                            <td>${product.price}</td>
                            <td>${product.stockQty}</td>
                            <td>
                                ${payload.role.toLowerCase() === "admin" ? `
                                    <a href="productInventoryEdit.html?productID=${product.productID}">Edit</a> |
                                    <button onclick="deleteProduct('${product.productID}')">Delete</button>
                                ` : ""}
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            });

        // Function to delete a product (only accessible to admins)
        function deleteProduct(productID) {
            if (confirm("Are you sure you want to delete this product?")) {
                fetch(`http://localhost:3000/productInventory/${productID}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`  // Include the JWT token for authorization
                    }
                })
                .then(res => {
                    if (res.ok) {
                        alert("Product deleted successfully");
                        location.reload();
                    } else {
                        alert("Failed to delete product");
                    }
                });
            }
        }
    </script>
</body>
</html>
