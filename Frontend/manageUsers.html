<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="manageUsers.css">
</head>
<body>
    <h1>All Users</h1>
    <a href="userAdd.html"><button>Add New User</button></a>
    <br><br>

    <!-- Users Table -->
    <table border="1">
        <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <!-- User rows will be added here -->
        </tbody>
    </table>

    <script>
        // Token validation for role-based access
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";  // Redirect to login if no token
        }

        const payload = JSON.parse(atob(token.split('.')[1]));  // Decode the JWT token
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access!");
            window.location.href = "memberDashboard.html";  // Redirect non-admins to member dashboard
        }

        // Fetch users data from backend with token authorization
        fetch("http://localhost:3000/users", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`  // Send token for authorization
            }
        })
        .then(res => {
            if (!res.ok) {
                throw new Error('Failed to load users');
            }
            return res.json();
        })
        .then(users => {
            const tbody = document.getElementById("userTableBody");
            if (!Array.isArray(users) || users.length === 0) {
                alert("No users found");
                return;
            }

            users.forEach(user => {
                const row = `
                    <tr id="user-${user.userID}">
                        <td>${user.userID}</td>
                        <td>${user.username}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.phone}</td>
                        <td>${user.role}</td>
                        <td>
                            <a href="userEdit.html?id=${user.userID}"><button>Edit</button></a> |
                            <button onclick="deleteUser('${user.userID}')">Delete</button>
                        </td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        })
        .catch(err => {
            console.error("Error fetching users:", err);
            alert("Failed to load user data. Check the console for errors.");
        });

        // Function to handle user deletion
        function deleteUser(id) {
            if (confirm("Are you sure you want to delete this user?")) {
                fetch(`http://localhost:3000/users/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`  // Send token for authorization
                    }
                })
                .then(res => {
                    if (res.ok) {
                        alert("User deleted");
                        const row = document.getElementById(`user-${id}`);
                        if (row) {
                            row.remove();  // Remove the deleted user's row from the table
                        }
                    } else {
                        alert("Failed to delete user");
                    }
                })
                .catch(err => {
                    console.error("Error deleting user:", err);
                    alert("Failed to delete user.");
                });
            }
        }
    </script>
</body>
</html>
