<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Sale</title>
    <link rel="stylesheet" href="salesIndex.css"> <!-- Link to your CSS -->
</head>
<body>
    <h1>Edit Sale</h1>
    <form id="salesForm">
        <label>Sale ID:</label><br>
        <input type="number" name="saleID" readonly><br><br>

        <label>Product Name:</label><br>
        <input type="text" name="productName" required><br><br>

        <label>Amount:</label><br>
        <input type="number" step="0.01" name="amount" required><br><br>

        <label>Sale Date:</label><br>
        <input type="date" name="saleDate" required><br><br>

        <button type="submit">Update Sale</button>
    </form>

    <script>
        // ✅ Admin-only access check
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html";
        }

        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role.toLowerCase() !== "admin") {
                alert("Unauthorized access. Admins only.");
                window.location.href = "login.html";
            }
        } catch (err) {
            alert("Invalid token. Please log in again.");
            window.location.href = "login.html";
        }

        // 🌐 Fetch and populate sale details
        const params = new URLSearchParams(window.location.search);
        const saleID = params.get("saleID");

        fetch(`http://localhost:3000/sales/${saleID}`)
            .then(res => res.json())
            .then(sale => {
                const form = document.forms["salesForm"];
                form.saleID.value = sale.saleID;
                form.productName.value = sale.productName;
                form.amount.value = sale.amount;
                form.saleDate.value = sale.saleDate;
            });

        // 📝 Handle form submission
        document.getElementById("salesForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const form = this;
            const data = {
                productName: form.productName.value,
                amount: form.amount.value,
                saleDate: form.saleDate.value
            };

            fetch(`http://localhost:3000/sales/${saleID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(res => {
                if (res.ok) {
                    alert("Sale updated successfully");
                    window.location.href = "salesIndex.html";
                } else {
                    alert("Failed to update sale");
                }
            });
        });
    </script>
</body>
</html>
