<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses</title>
    <link rel="stylesheet" href="expenseIndex.css"> <!-- Link to your CSS -->
</head>
<body>
    <h1>All Expenses</h1>
    <a href="expenseAdd.html">Add New Expense</a>
    <br><br>
    <table border="1">
        <thead>
            <tr>
                <th>Expense ID</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Expense Date</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="expenseTableBody">
            <!-- Expense rows will be added here -->
        </tbody>
    </table>

    <script>
        // ✅ Admin-only access check
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html";
        }

        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access. Admins only.");
            window.location.href = "login.html";
        }

        // ✅ Fetch and display expenses
        fetch("http://localhost:3000/expenses", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
        .then(res => res.json())
        .then(expenses => {
            const tbody = document.getElementById("expenseTableBody");

            expenses.forEach(expense => {
                const row = `
                    <tr>
                        <td>${expense.expenseID}</td>
                        <td>${expense.category}</td>
                        <td>${expense.amount}</td>
                       <td>${new Date(expense.expenseDate).toLocaleDateString('en-GB')}</td>
                        <td>${expense.description}</td>
                        <td>
                            <a href="expenseEdit.html?id=${expense.expenseID}">Edit</a> |
                            <button onclick="deleteExpense('${expense.expenseID}')">Delete</button>
                        </td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        });

        // ✅ Delete expense
        function deleteExpense(expenseID) {
            if (confirm("Are you sure you want to delete this expense?")) {
                fetch(`http://localhost:3000/expenses/${expenseID}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                })
                .then(res => {
                    if (res.ok) {
                        alert("Expense deleted successfully");
                        location.reload();
                    } else {
                        alert("Failed to delete expense");
                    }
                });
            }
        }
    </script>
</body>
</html>
