<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Sessions</title>
    <link rel="stylesheet" href="workoutSessionIndex.css"> <!-- Link to your CSS -->
</head>      
<body>
    <h1>All Workout Sessions</h1>
    <a href="workoutSessionAdd.html">Add New Session</a>
    <br><br>
    <table border="1">
        <thead>
            <tr>
                <th>Session ID</th>
                <th>Trainer ID</th>
                <th>Session Type</th>
                <th>Session Date</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="workoutSessionTableBody">
            <!-- Workout Session rows will be added here -->
        </tbody>
    </table>

    <script>
        // ✅ Role protection: allow only Admins
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html";
        }

        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access. Admins only.");
            window.location.href = "login.html";
        }

        // ✅ Fetch workout sessions
        fetch("http://localhost:3000/workoutSessions", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
        .then(res => res.json())
        .then(sessions => {
            const tbody = document.getElementById("workoutSessionTableBody");

            sessions.forEach(session => {
                const row = `
                    <tr>
                        <td>${session.sessionID}</td>
                        <td>${session.trainerID}</td>
                        <td>${session.sessionType}</td>
                        <td>${new Date(session.sessionDate).toLocaleDateString('en-GB')}</td>
                        <td>${new Date(session.startTime).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</td>
                        <td>${session.endTime ? new Date(session.endTime).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : 'N/A'}</td>

                        <td>
                            <a href="workoutSessionEdit.html?sessionID=${session.sessionID}">Edit</a> |
                            <button onclick="deleteSession('${session.sessionID}')">Delete</button>
                        </td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        })
        .catch(err => {
            console.error("Error fetching workout sessions:", err);
            alert("Failed to load sessions.");
        });

        function deleteSession(sessionID) {
            if (confirm("Are you sure you want to delete this session?")) {
                fetch(`http://localhost:3000/workoutSessions/${sessionID}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                })
                .then(res => {
                    if (res.ok) {
                        alert("Workout session deleted successfully");
                        location.reload();
                    } else {
                        alert("Failed to delete session");
                    }
                })
                .catch(err => {
                    console.error("Error deleting session:", err);
                    alert("Deletion failed.");
                });
            }
        }
    </script>
</body>
</html>
