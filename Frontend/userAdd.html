<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add User</title>
  <link rel="stylesheet" href="manageUsers.css">
</head>
<body>  
  <h1>Add New User</h1>

  <!-- Add User Form -->
  <form id="userForm">
    <label>Username: <input type="text" id="username" required></label><br><br>
    <label>Password: <input type="password" id="password" required></label><br><br>
    <label>Name: <input type="text" id="name" required></label><br><br>
    <label>Email: <input type="email" id="email" required></label><br><br>
    <label>Phone: <input type="text" id="phone" required></label><br><br>
    <label>Role: <input type="text" id="role" required></label><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="responseMsg"></p>

  <script>
    // Check if user is logged in and if they are an admin
    const token = localStorage.getItem("token");

    if (!token) {
      // No token, redirect to login
      window.location.href = "login.html";
    }

    const payload = JSON.parse(atob(token.split('.')[1]));

    // If the role is not 'admin', redirect to a page like 'unauthorized.html' or 'login.html'
    if (payload.role.toLowerCase() !== "admin") {
      alert("Unauthorized access!");
      window.location.href = "login.html";  // Or redirect to any unauthorized page
    }

    // Handling form submission to add a user
    document.getElementById("userForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const user = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        role: document.getElementById("role").value,
      };

      try {
        const res = await fetch("http://localhost:3000/usersno", {  // POST to /usersno endpoint
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        });

        const responseMsg = await res.text();
        document.getElementById("responseMsg").innerText = responseMsg;
      } catch (err) {
        document.getElementById("responseMsg").innerText = "Error submitting user.";
      }
    });
  </script>
</body>
</html>
