<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Supplier</title>
    <link rel="stylesheet" href="supplierIndex.css"> <!-- Link to your CSS -->
</head>
<body>
    <h1>Add New Supplier</h1>
    <form id="supplierForm">
        <label>Supplier ID: <input type="number" name="supplierID" required></label><br><br>
        <label>Name: <input type="text" name="name" required></label><br><br>
        <label>Contact: <input type="text" name="contact" required></label><br><br>
        <label>Email: <input type="email" name="email" required></label><br><br>
        <label>Product Supplied: <input type="text" name="productSupplied" required></label><br><br>
        <button type="submit">Add Supplier</button>
    </form>

    <script>
        // ✅ Admin-only access check
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html";
        }

        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role.toLowerCase() !== "admin") {
                alert("Unauthorized access. Admins only.");
                window.location.href = "login.html";
            }
        } catch (err) {
            alert("Invalid token. Please log in again.");
            window.location.href = "login.html";
        }

        document.getElementById('supplierForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const data = {
                supplierID: form.supplierID.value,
                name: form.name.value,
                contact: form.contact.value,
                email: form.email.value,
                productSupplied: form.productSupplied.value
            };

            const res = await fetch("http://localhost:3000/suppliers", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`  // 🔐 Send token with request
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert("Supplier added successfully");
                form.reset();
            } else {
                const err = await res.text();
                alert("Failed to add supplier: " + err);
            }
        });
    </script>
</body>
</html>
