<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <h2>TrainWise Login</h2>
    <form id="login-form">
        <input type="text" id="username" placeholder="Username" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <button type="submit">Log In</button>
    </form>

    <p id="responseMsg" style="color: red;"></p>  <!-- Error message area -->

    <script>
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save token to localStorage
                    localStorage.setItem('token', data.token);

                    // Redirect based on role
                    const role = data.role?.toLowerCase();  // Make case-insensitive
                    if (role === 'admin') {
                        window.location.href = 'adminDashboard.html';
                    } else if (role === 'trainer') {
                        window.location.href = 'trainerDashboard.html';
                    } else if (role === 'member') {
                        window.location.href = 'memberDashboard.html';
                    } else {
                        document.getElementById('responseMsg').innerText = 'Unknown user role. Contact admin.';
                    }
                } else {
                    document.getElementById('responseMsg').innerText = data.message || 'Login failed. Try again.';
                }
            } catch (err) {
                console.error("Login error:", err);
                document.getElementById('responseMsg').innerText = 'Network error or server not available.';
            }
        });
    </script>

</body>
</html>
