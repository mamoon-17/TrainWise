<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Trainer</title>
    <link rel="stylesheet" href="userStyle.css">
</head>
<body>
    <h1>Edit Trainer</h1>
    <form id="editTrainerForm">
        <input type="hidden" id="trainerID" name="trainerID" />

        <!-- Specialization Input (Editable) -->
        <label for="specialization">Specialization:</label>
        <input type="text" id="specialization" name="specialization" required /><br><br>

        <button type="submit">Save Changes</button>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trainerID = urlParams.get('id'); // Get the trainerID from the URL parameter

        document.addEventListener("DOMContentLoaded", async function() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html"; // Redirect if no token
            }

            try {
                // Fetch trainer data based on trainerID
                const response = await fetch(`http://localhost:3000/admin/trainer/${trainerID}`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`  // Send token for authentication
                    }
                });

                const trainer = await response.json();

                // Pre-fill the form with the trainer's specialization
                document.getElementById("trainerID").value = trainer.trainerID;
                document.getElementById("specialization").value = trainer.specialization;

            } catch (error) {
                console.error("Error fetching trainer data:", error);
                alert("Error fetching trainer data.");
            }
        });

        // Handle form submission
        document.getElementById("editTrainerForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const trainerID = document.getElementById("trainerID").value;
            const specialization = document.getElementById("specialization").value;

            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html"; // Redirect if no token
            }

            // Send the updated specialization to the backend
            const response = await fetch(`http://localhost:3000/admin/editTrainer/${trainerID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`  // Send token for authentication
                },
                body: JSON.stringify({ specialization })
            });

            if (response.ok) {
                alert("Trainer updated successfully");
                window.location.href = "manageTrainers.html";  // Redirect to manage trainers page
            } else {
                alert("Failed to update trainer. Please try again.");
            }
        });
    </script>
</body>
</html>
