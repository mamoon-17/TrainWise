<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainers</title>
    <link rel="stylesheet" href="userStyle.css"> <!-- Link to your CSS -->
</head>      
<body>
    <h1>All Trainers</h1>
    <a href="trainerAdd.html">Add New Trainer</a>
    <br><br>
    <table border="1">
        <thead>
            <tr>
                <th>Trainer ID</th> <!-- Same as UserID -->
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Specialization</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="trainerTableBody">
            <!-- Trainer rows will be added here -->
        </tbody>
    </table>

    <script>
        // Admin check - Ensure only admin users can access this page
        const token = localStorage.getItem("token");

        if (!token) {
            // No token, redirect to login
            window.location.href = "login.html";
        }

        const payload = JSON.parse(atob(token.split('.')[1]));

        // If the role is not 'admin', redirect to a page like 'unauthorized.html' or 'login.html'
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access!");
            window.location.href = "login.html";  // Or redirect to any unauthorized page
        }

        // Fetch trainers data and populate the table
        fetch("http://localhost:3000/trainers")
            .then(res => res.json())
            .then(trainers => {
                const tbody = document.getElementById("trainerTableBody");

                trainers.forEach(trainer => {
                    const row = `
                        <tr>
                            <td>${trainer.trainerID}</td> <!-- Display TrainerID (same as UserID) -->
                            <td>${trainer.name}</td>
                            <td>${trainer.email}</td>
                            <td>${trainer.phone}</td>
                            <td>${trainer.specialization}</td>
                            <td>
                                <a href="trainerEdit.html?id=${trainer.trainerID}">Edit</a> |
                                <button onclick="deleteTrainer('${trainer.trainerID}')">Delete</button>
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            });

        function deleteTrainer(id) {
            if (confirm("Are you sure you want to delete this trainer?")) {
                fetch(`http://localhost:3000/trainers/${id}`, {
                    method: "DELETE"
                })
                .then(res => {
                    if (res.ok) {
                        alert("Trainer deleted successfully");
                        location.reload();
                    } else {
                        alert("Failed to delete trainer");
                    }
                });
            }
        }
    </script>
</body>
</html>
