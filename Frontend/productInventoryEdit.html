<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link rel="stylesheet" href="productinventory.css"> <!-- Link to your CSS -->
</head>
<body>
    <h1>Edit Product</h1>
    <form id="productInventoryForm">
        <label>Product ID:</label><br>
        <input type="number" name="productID" readonly><br><br>

        <label>Product Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Price:</label><br>
        <input type="number" step="0.01" name="price" required><br><br>

        <label>Stock Quantity:</label><br>
        <input type="number" name="stockQty" required><br><br>

        <button type="submit">Update Product</button>
    </form>

    <script>
        // ✅ Admin-only access check
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html"; // Redirect to login page if no token
        }

        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access. Admins only.");
            window.location.href = "login.html"; // Redirect to login page if user is not admin
        }

        const params = new URLSearchParams(window.location.search);
        const productID = params.get("productID");

        // Fetch product details to populate the form
        fetch(`http://localhost:3000/productInventory/${productID}`)
            .then(res => res.json())
            .then(product => {
                const form = document.forms["productInventoryForm"];
                form.productID.value = product.productID;
                form.name.value = product.name;
                form.price.value = product.price;
                form.stockQty.value = product.stockQty;
            });

        // Handle form submission to update product
        document.getElementById("productInventoryForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const form = this;
            const data = {
                name: form.name.value,
                price: form.price.value,
                stockQty: form.stockQty.value
            };

            fetch(`http://localhost:3000/productInventory/${productID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`  // Add JWT token for authorization
                },
                body: JSON.stringify(data)
            })
            .then(res => {
                if (res.ok) {
                    alert("Product updated successfully");
                    window.location.href = "productInventoryIndex.html"; // Redirect after successful update
                } else {
                    alert("Failed to update product");
                }
            });
        });
    </script>
</body>
</html>
