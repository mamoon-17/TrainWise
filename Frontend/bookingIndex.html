<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings</title>
    <link rel="stylesheet" href="bookingIndex.css"> <!-- Link to your CSS -->
</head>      
<body>
    <h1>All Bookings</h1>
    <a href="bookingAdd.html">Add New Booking</a>
    <br><br>
    <table border="1">
        <thead>
            <tr>
                <th>Booking ID</th>
                <th>Member ID</th>
                <th>Session ID</th>
                <th>Booking Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bookingTableBody">
            <!-- Booking rows will be added here -->
        </tbody>
    </table>

    <script>
        // Admin check - Ensure only admin users can access this page
        const token = localStorage.getItem("token");

        if (!token) {
            // No token, redirect to login
            window.location.href = "login.html";
        }

        const payload = JSON.parse(atob(token.split('.')[1]));

        // If the role is not 'admin', redirect to a page like 'unauthorized.html' or 'login.html'
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access!");
            window.location.href = "login.html";  // Or redirect to any unauthorized page
        }

        // Fetch booking data
        fetch("http://localhost:3000/bookings")
            .then(res => res.json())
            .then(bookings => {
                const tbody = document.getElementById("bookingTableBody");

                bookings.forEach(booking => {
                    const row = `
                        <tr>
                            <td>${booking.bookingID}</td>
                            <td>${booking.memberID}</td>
                            <td>${booking.sessionID}</td>
                           <td>${new Date(booking.bookingDate).toLocaleDateString('en-GB')}</td>
                            <td>${booking.status}</td>
                            <td>
                                <a href="bookingEdit.html?bookingID=${booking.bookingID}">Edit</a> |
                                <button onclick="deleteBooking('${booking.bookingID}')">Delete</button>
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            });

        // Function to handle booking deletion
        function deleteBooking(bookingID) {
            if (confirm("Are you sure you want to delete this booking?")) {
                fetch(`http://localhost:3000/bookings/${bookingID}`, {
                    method: "DELETE"
                })
                .then(res => {
                    if (res.ok) {
                        alert("Booking deleted successfully");
                        location.reload();  // Reload the page to reflect changes
                    } else {
                        alert("Failed to delete booking");
                    }
                });
            }
        }
    </script>
</body>
</html>
