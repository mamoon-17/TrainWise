<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Trainer</title>
    <link rel="stylesheet" href="manageMembers.css"> <!-- Link to your CSS -->
</head>
<body>
    <h1>Edit Trainer</h1>
    <form id="trainerForm">
        <label>Trainer ID:</label><br>
        <input type="number" name="trainerID" required readonly><br><br>

        <label>Specialization:</label><br>
        <input type="text" name="specialization" required><br><br>

        <button type="submit">Update Trainer</button>
    </form>

    <script>
        // Admin check - Ensure only admin users can access this page
        const token = localStorage.getItem("token");

        if (!token) {
            // No token, redirect to login
            window.location.href = "login.html";
        }

        const payload = JSON.parse(atob(token.split('.')[1]));

        // If the role is not 'admin', redirect to a page like 'unauthorized.html' or 'login.html'
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access!");
            window.location.href = "login.html";  // Or redirect to any unauthorized page
        }

        // Get the trainer ID from the URL
        const params = new URLSearchParams(window.location.search);
        const trainerID = params.get("id");

        // Fetch trainer data and fill the form
        fetch(`http://localhost:3000/trainers/${trainerID}`)
            .then(res => res.json())
            .then(trainer => {
                const form = document.forms["trainerForm"];
                form.trainerID.value = trainer.trainerID;
                form.specialization.value = trainer.specialization;
            })
            .catch(error => {
                console.error("Error fetching trainer data:", error);
                alert("Failed to load trainer data.");
            });

        // Submit the updated trainer data
        document.getElementById("trainerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const form = this;
            const data = {
                specialization: form.specialization.value
            };

            fetch(`http://localhost:3000/trainers/${trainerID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(res => {
                if (res.ok) {
                    alert("Trainer updated successfully");
                    window.location.href = "trainerIndex.html";  // Redirect to list page
                } else {
                    alert("Failed to update trainer");
                }
            })
            .catch(error => {
                console.error("Error updating trainer:", error);
                alert("Failed to update trainer.");
            });
        });
    </script>
</body>
</html>
