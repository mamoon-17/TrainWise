<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link rel="stylesheet" href="productinventory.css"> <!-- Link to your CSS -->
</head>
<body>
    <h1>Add New Product</h1>
    <form id="productInventoryForm">
        <label>Product ID: <input type="number" name="productID" required></label><br><br>
        <label>Product Name: <input type="text" name="name" required></label><br><br>
        <label>Price: <input type="number" step="0.01" name="price" required></label><br><br>
        <label>Stock Quantity: <input type="number" name="stockQty" required></label><br><br>
        <button type="submit">Add Product</button>
    </form>

    <script>
        // ✅ Admin-only access check
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html"; // Redirect to login page if no token
        }

        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access. Admins only.");
            window.location.href = "login.html"; // Redirect to login page if user is not admin
        }

        document.getElementById('productInventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const data = {
                productID: form.productID.value,
                name: form.name.value,
                price: form.price.value,
                stockQty: form.stockQty.value
            };

            const res = await fetch("http://localhost:3000/productInventory", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`  // Add JWT token for authorization
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert("Product added successfully");
                form.reset();
            } else {
                const err = await res.text();
                alert("Failed to add product: " + err);
            }
        });
    </script>
</body>
</html>
