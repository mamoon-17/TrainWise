<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Payment</title>
    <link rel="stylesheet" href="paymentHistoryIndex.css"> <!-- Link to your CSS -->
</head>
<body>
    <h1>Edit Payment</h1>
    <form id="paymentForm">
        <label>Payment ID:</label><br>
        <input type="number" name="paymentID" readonly><br><br>

        <label>Member ID:</label><br>
        <input type="number" name="memberID" required><br><br>

        <label>Amount:</label><br>
        <input type="number" step="0.01" name="amount" required><br><br>

        <label>Payment Method:</label><br>
        <select name="paymentMethod" required>
            <option value="Card">Card</option>
            <option value="Cash">Cash</option>
        </select><br><br>

        <label>Payment Date:</label><br>
        <input type="date" name="paymentDate" required><br><br>

        <button type="submit">Update Payment</button>
    </form>

    <script>
        // ✅ Admin-only access check
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please log in first.");
            window.location.href = "login.html";
        }

        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role.toLowerCase() !== "admin") {
            alert("Unauthorized access. Admins only.");
            window.location.href = "login.html";
        }

        const params = new URLSearchParams(window.location.search);
        const paymentID = params.get("paymentID");

        // ✅ Fetch payment details (accessible only to admins)
        fetch(`http://localhost:3000/paymentHistory/${paymentID}`, {
            headers: {
                "Authorization": `Bearer ${token}` // Include the JWT token for authorization
            }
        })
        .then(res => res.json())
        .then(payment => {
            const form = document.forms["paymentForm"];
            form.paymentID.value = payment.paymentID;
            form.memberID.value = payment.memberID;
            form.amount.value = payment.amount;
            form.paymentMethod.value = payment.paymentMethod;
            form.paymentDate.value = payment.paymentDate;
        });

        document.getElementById("paymentForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const form = this;
            const data = {
                memberID: form.memberID.value,
                amount: form.amount.value,
                paymentMethod: form.paymentMethod.value,
                paymentDate: form.paymentDate.value
            };

            fetch(`http://localhost:3000/paymentHistory/${paymentID}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}` // Include the JWT token for authorization
                },
                body: JSON.stringify(data)
            })
            .then(res => {
                if (res.ok) {
                    alert("Payment updated successfully");
                    window.location.href = "paymentHistoryIndex.html";
                } else {
                    alert("Failed to update payment");
                }
            });
        });
    </script>
</body>
</html>
